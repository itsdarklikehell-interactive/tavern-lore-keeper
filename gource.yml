# Gource configuration — The Tavern Lore Keeper
# Repository: github.com/itsdarklikehell/tavern-lore-keeper  (fork of d0nniedank0/tavern-lore-keeper)
# Upstream:   github.com/d0nniedank0/tavern-lore-keeper
# Purpose: repository metadata, source paths and visualisation settings for Gource.
# Version: 1

version: 1

repository:
  name: tavern-lore-keeper
  owner: itsdarklikehell
  upstream: d0nniedank0/tavern-lore-keeper
  url: https://github.com/itsdarklikehell/tavern-lore-keeper
  default_branch: main
  live_url: https://tavern-lore-keeper.pages.dev/
  description: >
    The Tavern Lore Keeper — a rumor-mill and flavor generator for D&D tables.
    Taverns, rumors, mysterious patrons and cursed items, all in literary voice.

metadata:
  title: The Tavern Lore Keeper
  tagline: Every tavern has a story
  license: MIT
  pwa: false
  dark_mode: false
  package_manager: npm
  package_name: tavern-lore-keeper
  package_version: 1.0.0
  private: true
  languages:
    - HTML
    - JavaScript

# A single-file app: the engine lives inside index.html.
source_paths:
  - index.html     # page, styles and the engine (pure functions, no DOM)
  - test/          # engine.test.js (pure) and ui.test.js (jsdom)
  - package.json

entry_points:
  - index.html
  - package.json

rendering:
  width: 1920
  height: 1080
  fps: 60
  seconds_per_day: 2
  auto_skip_seconds: 1
  max_files: 0
  background: "#1A120C"
  font_size: 16
  title: The Tavern Lore Keeper development timeline
  highlight_users: true
  dir_name_depth: 2
  dir_name_position: 0.5

camera:
  mode: overview
  auto_rotate: true

ci:
  test_command: npm test
  note: No .github/workflows directory; CI is the outstanding gap.

local_generation: |
  # Render locally with Gource + ffmpeg (1080p60).
  gource --seconds-per-day 2 -1920x1080 --auto-skip-seconds 1 \
    --hide-users --hide-filenames --title "The Tavern Lore Keeper development timeline" \
    --output-ppm-stream - --output-framerate 60 2>/dev/null | \
  ffmpeg -y -r 60 -i - -c:v libx264 -preset fast -crf 23 \
    -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
    tavern-lore-keeper_gource_1080p.mp4 2>/dev/null
